services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskprueba-app
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-taskprueba}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      APP_PORT: ${APP_PORT:-8080}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: taskprueba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskprueba}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: taskprueba-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-postgres}
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
